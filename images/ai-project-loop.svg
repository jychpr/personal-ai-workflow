<svg xmlns="http://www.w3.org/2000/svg" width="680" height="572" viewBox="0 0 680 572" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>AI-assisted project loop</title>
<desc>Six-step loop: 1 plan (advisor), 2 decide (GitHub repo), 3 run (Claude Code and Cowork in parallel), 4 bring back, 5 rules first, 6 close out, then back to 1. Me sits in the middle as the only bridge. Solid arrows run on their own; dashed arrows are done by hand.</desc>
<defs>
<marker id="ah-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ah-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="572" fill="#FFFFFF"/>

<g fill="none" stroke-width="1.5">
<line x1="456" y1="58" x2="496" y2="58" stroke="#5F5E5A" marker-end="url(#ah-gray)"/>
<line x1="456" y1="84" x2="496" y2="84" stroke="#D85A30" stroke-dasharray="5 4" marker-end="url(#ah-coral)"/>
<path d="M60 224 V166 Q60 142 84 142 H140" stroke="#D85A30" stroke-dasharray="5 4" marker-end="url(#ah-coral)"/>
<path d="M168 142 H346" stroke="#D85A30" stroke-dasharray="5 4" marker-end="url(#ah-coral)"/>
<path d="M374 142 H416 Q440 142 440 166 V406 Q440 430 416 430 H264" stroke="#D85A30" stroke-dasharray="5 4" marker-end="url(#ah-coral)"/>
<path d="M236 430 H84 Q60 430 60 406 V390" stroke="#D85A30" stroke-dasharray="5 4" marker-end="url(#ah-coral)"/>
<path d="M60 362 V320" stroke="#5F5E5A" marker-end="url(#ah-gray)"/>
<path d="M60 292 V250" stroke="#5F5E5A" marker-end="url(#ah-gray)"/>
<path d="M250 444 V452 H156 V466" stroke="#5F5E5A" marker-end="url(#ah-gray)"/>
<path d="M250 452 H344 V466" stroke="#5F5E5A" marker-end="url(#ah-gray)"/>
</g>

<g font-size="12" fill="#5F5E5A">
<text x="506" y="62">Runs on its own</text>
<text x="506" y="88">I do it by hand</text>
</g>

<rect x="70" y="40" width="168" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="154" y="63" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">Advisor</text>
<text x="154" y="80" text-anchor="middle" font-size="12" fill="#534AB7">plans, reviews, drafts</text>
<text x="154" y="116" text-anchor="middle" font-size="12" fill="#5F5E5A">Sees main only, after Sync</text>

<rect x="290" y="40" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="360" y="63" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">GitHub repo</text>
<text x="360" y="80" text-anchor="middle" font-size="12" fill="#5F5E5A">project memory</text>
<text x="360" y="116" text-anchor="middle" font-size="12" fill="#5F5E5A">Only I merge dev into main</text>

<rect x="265" y="268" width="150" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="291" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">Me</text>
<text x="340" y="308" text-anchor="middle" font-size="12" fill="#993C1D">paste, commit, Sync</text>
<text x="340" y="344" text-anchor="middle" font-size="12" fill="#5F5E5A">The only bridge</text>

<rect x="72" y="470" width="168" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="156" y="493" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">Claude Code</text>
<text x="156" y="510" text-anchor="middle" font-size="12" fill="#534AB7">code, tests, long jobs</text>
<text x="156" y="546" text-anchor="middle" font-size="12" fill="#5F5E5A">Works on dev, never merges</text>

<rect x="260" y="470" width="168" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="344" y="493" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">Cowork</text>
<text x="344" y="510" text-anchor="middle" font-size="12" fill="#534AB7">papers and documents</text>
<text x="344" y="546" text-anchor="middle" font-size="12" fill="#5F5E5A">Linked only through me</text>

<g fill="#FFFFFF" stroke="#888780" stroke-width="0.5">
<circle cx="154" cy="142" r="12"/>
<circle cx="360" cy="142" r="12"/>
<circle cx="250" cy="430" r="12"/>
<circle cx="60" cy="376" r="12"/>
<circle cx="60" cy="306" r="12"/>
<circle cx="60" cy="236" r="12"/>
</g>
<g font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle">
<text x="154" y="147">1</text>
<text x="360" y="147">2</text>
<text x="250" y="435">3</text>
<text x="60" y="381">4</text>
<text x="60" y="311">5</text>
<text x="60" y="241">6</text>
</g>

<g font-size="14" font-weight="500" fill="#2C2C2A">
<text x="154" y="177" text-anchor="middle">Plan</text>
<text x="360" y="177" text-anchor="middle">Decide</text>
<text x="268" y="401">Run</text>
<text x="84" y="372">Bring back</text>
<text x="84" y="302">Rules first</text>
<text x="84" y="232">Close out</text>
</g>
<g font-size="12" fill="#5F5E5A">
<text x="154" y="194" text-anchor="middle">decision + 2 prompts</text>
<text x="360" y="194" text-anchor="middle">commit, merge, Sync</text>
<text x="268" y="418">in parallel</text>
<text x="84" y="389">paste reports, attach files</text>
<text x="84" y="319">committed before reading</text>
<text x="84" y="249">verify, merge, Sync</text>
</g>

<g fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5">
<rect x="456" y="150" width="184" height="69" rx="4"/>
<rect x="456" y="231" width="184" height="69" rx="4"/>
<rect x="456" y="312" width="184" height="86" rx="4"/>
</g>
<g font-size="12" fill="#444441">
<text x="468" y="176">DECISIONS.md</text>
<text x="468" y="193">overrides everything;</text>
<text x="468" y="210">only I edit it.</text>
<text x="468" y="257">Every number lives in</text>
<text x="468" y="274">results/, with how it</text>
<text x="468" y="291">was made.</text>
<text x="468" y="338">Handoff: chat too long →</text>
<text x="468" y="355">rewrite CHECKPOINT.md,</text>
<text x="468" y="372">start a new advisor chat</text>
<text x="468" y="389">from it.</text>
</g>
</svg>
